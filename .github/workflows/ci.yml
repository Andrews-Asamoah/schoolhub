name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline on PR base
    if: github.event_name == 'pull_request'
    # Baseline failures are reported per step but do not block the proposed branch.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolhub_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolhub_test?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install baseline dependencies
        id: install
        run: pnpm install --frozen-lockfile
      # The baseline checkout does not run workspace build scripts automatically.
      # Build the shared package and generate Prisma's client before typechecking
      # or running API tests; otherwise clean runners fail at module resolution.
      - name: Prepare baseline workspace
        id: prepare
        if: ${{ steps.install.outcome == 'success' }}
        run: |
          pnpm --filter @schoolhub/shared build
          pnpm --filter @schoolhub/api exec prisma generate --config prisma.config.ts
      - name: Baseline typecheck
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        # Run workspaces sequentially. The API typecheck rebuilds @schoolhub/shared;
        # running web concurrently can read declaration files while they are cleaned.
        run: |
          pnpm --filter @schoolhub/shared typecheck
          pnpm --filter @schoolhub/api typecheck
          pnpm --filter @schoolhub/web typecheck
      - name: Baseline web build
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: pnpm --filter @schoolhub/web build
      - name: Baseline API lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm --filter @schoolhub/api lint
      - name: Apply baseline migrations
        id: migrate
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm --filter @schoolhub/api exec prisma migrate deploy --config prisma.config.ts
      - name: Baseline API tests (including PostgreSQL integration)
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.migrate.outcome == 'success' }}
        run: pnpm --filter @schoolhub/api test
      - name: Baseline web theme lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm --filter @schoolhub/web lint:theme

  validate:
    name: Validate proposed changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolhub_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolhub_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Match the baseline job: prepare generated workspace outputs first, then
      # typecheck packages sequentially so API typecheck cannot clean shared
      # declaration files while the web typecheck is resolving them.
      - name: Prepare workspace
        id: prepare
        run: |
          pnpm --filter @schoolhub/shared build
          pnpm --filter @schoolhub/api exec prisma generate --config prisma.config.ts
      - name: Typecheck
        run: |
          pnpm --filter @schoolhub/shared typecheck
          pnpm --filter @schoolhub/api typecheck
          pnpm --filter @schoolhub/web typecheck
      - name: Web build
        run: pnpm --filter @schoolhub/web build
      - name: SuperAdmin dashboard browser E2E
        env:
          SCHOOLHUB_WEB_URL: http://127.0.0.1:5173
        run: |
          # Run Vite directly from the web workspace. This avoids forwarding an
          # extra argument separator through pnpm's script runner.
          pnpm --filter @schoolhub/web exec vite --host 127.0.0.1 --strictPort > /tmp/schoolhub-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$SCHOOLHUB_WEB_URL" > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Vite did not become ready at $SCHOOLHUB_WEB_URL. Server output follows:"
            cat /tmp/schoolhub-web.log
            exit 1
          fi
          pnpm dlx --package=playwright@1.56.1 -c 'export PLAYWRIGHT_PACKAGE_ENTRY="$(realpath "$(dirname "$(command -v playwright)")/../playwright/cli.js")"; playwright install --with-deps chromium; node apps/web/e2e/superadmin-dashboard.browser.mjs && node apps/web/e2e/subscription-plan-editor.browser.mjs'
      - name: Check controller route inventory
        run: node apps/api/scripts/route-inventory.mjs --check
      - name: Validate release manifest contracts
        run: node --test scripts/release-manifest.test.mjs
      - name: API lint
        run: pnpm --filter @schoolhub/api lint
      - name: Apply database migrations
        run: pnpm --filter @schoolhub/api exec prisma migrate deploy --config prisma.config.ts
      - name: API tests (including PostgreSQL integration)
        run: pnpm --filter @schoolhub/api test
      - name: Web theme lint
        run: pnpm --filter @schoolhub/web lint:theme
      - name: Web unit tests
        run: pnpm --filter @schoolhub/web test
      # Real sign-in flow (password + authenticator code, backup codes, lockout,
      # super-admin and school-admin enforcement) against the migrated database.
      - name: Two-factor authentication end-to-end (PostgreSQL)
        run: pnpm --filter @schoolhub/api test:e2e:2fa
      # Catch anything that type-checks but cannot be built for deployment.
      - name: Build API
        run: pnpm --filter @schoolhub/api build
      - name: Build web
        run: pnpm --filter @schoolhub/web build

  container-smoke:
    name: Container smoke (${{ matrix.component }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build the runtime image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker build -f "apps/$COMPONENT/Dockerfile" --build-arg "BUILD_SHA=$GITHUB_SHA" -t "schoolhub-smoke:$COMPONENT" .
      - name: Boot and probe the runtime image
        env:
          COMPONENT: ${{ matrix.component }}
        run: bash .github/scripts/smoke-image.sh "schoolhub-smoke:$COMPONENT" "$COMPONENT"
