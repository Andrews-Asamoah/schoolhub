name: Container images
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  approve-source:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require successful push CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', per_page: 100});
              const run = data.workflow_runs.find(run => run.head_sha === context.sha && run.head_repository?.full_name === context.payload.repository.full_name && ['dev', 'main'].includes(run.head_branch));
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Exact-commit CI did not succeed. No release images will be published.');
                core.notice(`Approved CI run ${run.id} for ${context.sha}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Exact-commit push CI did not finish successfully within the release window.');
  build:
    needs: approve-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/schoolhub-${{ matrix.name }}
          tags: type=sha,format=long
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke-test the published image by digest
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/smoke-image.sh "ghcr.io/${OWNER,,}/schoolhub-${COMPONENT}@${IMAGE_DIGEST}" "$COMPONENT"
      - name: Record component digest and migration baseline
        uses: actions/github-script@v7
        env:
          COMPONENT: ${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const fs = require('node:fs');
            const {expectedMigration} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-manifest.mjs`);
            const component = process.env.COMPONENT;
            fs.writeFileSync(`component-${component}.json`, JSON.stringify({component, commit: context.sha, expectedMigration: expectedMigration(process.env.GITHUB_WORKSPACE), image: `ghcr.io/${context.repo.owner.toLowerCase()}/schoolhub-${component}@${process.env.DIGEST}`}));
      - uses: actions/upload-artifact@v4
        with:
          name: release-component-${{ matrix.name }}
          path: component-${{ matrix.name }}.json
          retention-days: 90
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-component-*
          merge-multiple: true
          path: components
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {assembleManifest, expectedMigration} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-manifest.mjs`);
            const components = ['api', 'web'].map(name => JSON.parse(fs.readFileSync(`components/component-${name}.json`, 'utf8')));
            const manifest = assembleManifest(components, context.payload.repository.full_name, context.sha, context.runId, expectedMigration(process.env.GITHUB_WORKSPACE));
            fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2));
            await core.summary.addHeading('Verified release images').addRaw(`Commit: ${context.sha}`).addTable([['Component','Digest reference'], ...Object.entries(manifest.images)]).write();
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 90
