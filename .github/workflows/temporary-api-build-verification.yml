name: SchoolHub API build verification (standalone dependency fix)

on:
  push:
    branches:
      - fix/theme-token-violations

permissions:
  contents: read

jobs:
  api-production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @schoolhub/api build
