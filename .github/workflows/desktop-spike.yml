name: Desktop spike

# Manual only, so it cannot affect the normal CI. Phase 0 of the desktop app: proves that SQLCipher
# and the Tauri shell build on a Windows runner and that an unsigned installer can be produced.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schoolhub/desktop..."
      - name: Sync model tests
        run: pnpm --filter @schoolhub/desktop test
      - name: Rust tests (SQLCipher with vendored OpenSSL)
        working-directory: apps/desktop/src-tauri
        run: cargo test --features vendored-openssl
      - name: Build the unsigned installer
        run: pnpm --filter @schoolhub/desktop build -- --features vendored-openssl
      - name: Report installer size
        shell: bash
        run: ls -l apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: schoolhub-desktop-spike-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
