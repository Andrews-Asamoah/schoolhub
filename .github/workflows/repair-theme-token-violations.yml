name: Repair theme token violations (Prisma generation)

on:
  push:
    branches:
      - fix/theme-token-violations

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      # Prisma Client generation needs a syntactically valid URL but does not connect to the database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schoolhub?schema=public
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate raw colour utilities to theme tokens
        run: node apps/web/scripts/migrate-theme-tokens.mjs

      - name: Commit generated theme migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          if ! git diff --cached --quiet; then
            git commit -m "fix(theme): migrate raw colours to semantic tokens"
            git push origin HEAD:fix/theme-token-violations
          else
            echo "The migration produced no source changes."
          fi

      - name: Verify theme-token rules
        run: pnpm --filter @schoolhub/web lint:theme

      - name: Verify theme contrast
        run: pnpm --filter @schoolhub/web audit:theme

      - name: Typecheck the workspace
        run: pnpm typecheck

      - name: Build the web app
        run: pnpm --filter @schoolhub/web build
