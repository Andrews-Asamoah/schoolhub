packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks install scripts by default; allow the ones we need
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  workerd: false

# Security patches for transitive runtime/config dependencies. Remove selectors
# after upstream ranges no longer resolve the vulnerable versions.
overrides:
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'mysql2@<3.23.1': 3.23.1
  'deepmerge-ts@<8.0.0': 8.0.0
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'qs@>=6.7.0 <6.16.1': 6.16.1
  'seroval@>=1.5.5 <1.6.11': 1.6.11
  'uuid@<11.1.1': 11.1.1
