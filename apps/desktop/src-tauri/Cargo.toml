[package]
name = "schoolhub-desktop"
version = "0.0.0"
description = "SchoolHub Desktop: Phase 0 feasibility spike"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "schoolhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
hex = "0.4"
# The local database is encrypted at rest. SQLCipher is compiled in, so there is no system sqlite to rely on.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
# The OS credential store: Windows Credential Manager, macOS Keychain, Secret Service on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
# Builds OpenSSL from source instead of using the system copy. This is what the Windows build needs
# (it requires Perl), and Phase 0 must prove it works on the Windows CI runner and on a developer PC.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
