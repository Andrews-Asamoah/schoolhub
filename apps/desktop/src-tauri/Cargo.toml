[package]
name = "schoolhub-desktop-spike"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
shell = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "schoolhub-desktop-spike"
path = "src/main.rs"
required-features = ["shell"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "gzip"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
